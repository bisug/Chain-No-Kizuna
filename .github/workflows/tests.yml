name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      # The bot refuses to import without these; they are never sent to Telegram.
      TOKEN: "123456789:CIplaceholderTOKEN000000000000000"
      MONGO_URI: "mongodb://127.0.0.1:27017"
      REDIS_URL: "redis://localhost:6379/0"
      OWNER_ID: "1"

    # A service container, because the ubuntu runner image no longer ships
    # redis-server (the step failed with "redis-server: command not found").
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        # Matches requires-python (>=3.14) in pyproject.toml.
        python-version: "3.14"

    - name: Install uv
      # setup-uv publishes only concrete tags (v10.0.0, v10.1.0, ...); there is no
      # floating `v10`, so this must stay pinned or the job fails to resolve.
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true

    - name: Install dependencies
      # The project is an application, not a distributable package (no
      # [build-system]), so `uv sync` alone is the correct install step.
      run: uv sync --frozen

    - name: Wait for Redis
      # The runner image has neither redis-server nor redis-cli, so probe with
      # the redis client that is already installed in the venv.
      run: |
        uv run --no-sync python - <<'PY'
        import time
        import redis
        client = redis.Redis(host="localhost", port=6379)
        for _ in range(30):
            try:
                if client.ping():
                    print("redis is ready")
                    raise SystemExit(0)
            except redis.exceptions.ConnectionError:
                time.sleep(1)
        raise SystemExit("redis did not become ready")
        PY

    - name: Run test suite
      # RUN_REDIS_TESTS=1 enables the live-Redis leader-election test.
      run: |
        export RUN_REDIS_TESTS=1
        uv run --no-sync python -m unittest discover -s tests -t . -v

    - name: Lint for real errors (pyflakes + syntax)
      run: uvx ruff@latest check --no-cache --select F,E9 chainnokizuna config.py tests
